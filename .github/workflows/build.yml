name: "Build flake packages"

on:
  push:
    paths:
      - "flake.*"
  workflow_dispatch:

jobs:
  nix-build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          docker-images: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Setup magic nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: "ataraxia-builds"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Install and setup direnv
        run: |
          curl -sfL https://direnv.net/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          direnv allow .
          direnv export gha >> "$GITHUB_ENV"
      - name: Build packages
        run: |
          nix-fast-build --skip-cached --no-nom \
            --flake .#packages."$(nix eval --raw --impure --expr builtins.currentSystem)" \
            --result-file build.json --result-format json
      - name: Print failed builds (if any)
        run: jq '.results[] | select(.success != true)' build.json
