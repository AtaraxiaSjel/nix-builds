name: "Build flake packages"

on:
  push:
    paths:
      - "flake.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  nix-build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          docker-images: true
          dotnet: true
          haskell: true
          large-packages: false
          preinstalled-runtimes: false
          swap-storage: false
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the release branch we force-push keeps it
          fetch-depth: 0
      - name: Install nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Setup magic nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: "ataraxia-builds"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Install and setup direnv
        run: |
          curl -sfL https://direnv.net/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          direnv allow .
          direnv export gha >> "$GITHUB_ENV"
      - name: Build packages
        id: build
        run: |
          nix-fast-build --skip-cached --no-nom \
            --flake .#packages."$(nix eval --raw --impure --expr builtins.currentSystem)" \
            --result-file build.json --result-format json
      - name: Print failed builds (if any)
        run: jq '.results[] | select(.success != true)' build.json
      - name: Push to niks3
        # Second cache target in addition to Cachix. A failure here must not
        # block the release branch (the build itself is fine and the packages
        # are in Cachix), but the step stays visible as failed in the run.
        continue-on-error: true
        env:
          NIKS3_SERVER_URL: "https://nix-cache.ataraxiadev.com"
          NIKS3_API_TOKEN: ${{ secrets.NIKS3_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NIKS3_API_TOKEN//[[:space:]]/}" ]]; then
            echo "::warning::NIKS3_API_TOKEN is empty, skipping niks3 push. Set it in Settings → Secrets → Actions."
            exit 0
          fi
          # the client reads the token from a file
          printf '%s' "$NIKS3_API_TOKEN" > "$RUNNER_TEMP/niks3-auth-token"
          chmod 600 "$RUNNER_TEMP/niks3-auth-token"
          export NIKS3_AUTH_TOKEN_FILE="$RUNNER_TEMP/niks3-auth-token"
          # every output of every successfully built package
          jq -r '.results[] | select(.type == "BUILD" and .success == true) | .outputs | to_entries[].value' \
            build.json | sort -u > "$RUNNER_TEMP/niks3-paths.txt"
          if [[ ! -s "$RUNNER_TEMP/niks3-paths.txt" ]]; then
            echo "::warning::no built store paths to push to niks3"
            exit 0
          fi
          echo "Pushing $(wc -l < "$RUNNER_TEMP/niks3-paths.txt") store paths to niks3"
          # niks3 resolves the closure itself (nix path-info --recursive) and
          # uploads it. -r: do not run the command if the list is empty.
          xargs -r -a "$RUNNER_TEMP/niks3-paths.txt" niks3 push
      - name: Push release branch on success
        # Release = last flake.lock for which every package built successfully.
        # A failed run must never advance the release branch.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git push --force origin HEAD:refs/heads/release
      - name: Notify Telegram on failure
        # notify must never fail the job itself
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 404 from api.telegram.org almost always means the bot token is
          # missing/invalid (URL becomes .../bot/sendMessage). Fail loudly
          # here instead of a cryptic `curl: (22) ... 404`.
          if [[ -z "${TG_TOKEN//[[:space:]]/}" ]]; then
            echo "::warning::TELEGRAM_BOT_TOKEN is empty, skipping Telegram notify. Set it in Settings → Secrets → Actions."
            exit 0
          fi
          if [[ -z "${TG_CHAT//[[:space:]]/}" ]]; then
            echo "::warning::TELEGRAM_CHAT_ID is empty, skipping Telegram notify. Set it in Settings → Secrets → Actions."
            exit 0
          fi
          MSG="⚠️ nix-builds CI failed for ${GITHUB_SHA::7} (kernel/flake build); release branch NOT updated. Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Notifying Telegram chat"
          # No -f flag on purpose: on error we want the API body in the log
          # (e.g. {"ok":false,"error_code":404,...}), not just `curl: (22)`.
          HTTP_CODE="$(curl -sS -o /tmp/tg-response.txt -w '%{http_code}' -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_notification=true" || echo "curl-failed")"
          echo "Telegram HTTP code: $HTTP_CODE"
          head -c 1000 /tmp/tg-response.txt 2>/dev/null; echo
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning::Telegram notify failed with HTTP $HTTP_CODE (see body above). Check TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID."
          fi
